<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수강 신청 관리 | AI 라이프 메이커</title>
<link rel="icon" href="ailifemaker_logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0F1B2D; --cyan-lt:#67E8F9; --teal:#0E7490; --amber:#FBBF24; --amber-ink:#1A1405;
  --text:#0F1B2D; --text-2:#334155; --text-3:#475569; --text-4:#64748B;
  --line:#E2E8F0; --soft:#F4F7FA; --soft-2:#EEF2F6; --danger:#B91C1C;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; background:var(--soft); color:var(--text); font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word; }
h1,p{ margin:0; }
input,select,button{ font-family:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:none; box-shadow:0 0 0 3px #fff,0 0 0 6px var(--teal); }

.input{ width:100%; min-height:48px; padding:0 12px; font-size:16px; color:var(--text); background:#fff; border:2px solid #94A3B8; border-radius:10px; }
.input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,116,144,.25); }
.err{ color:var(--danger); font-size:15px; font-weight:600; }
.btn{ display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 28px; border:0; border-radius:999px; background:var(--amber); color:var(--amber-ink); font-size:18px; font-weight:800; cursor:pointer; }
.btn:disabled{ opacity:.6; cursor:default; }

/* 로그인 */
.login{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--navy); }
.login form{ display:grid; gap:16px; width:100%; max-width:400px; padding:28px; background:#fff; border-radius:20px; }
.login h1{ font-size:24px; font-weight:800; }
.login label{ display:grid; gap:6px; font-weight:700; font-size:16px; }
.login small{ font-size:14px; line-height:1.5; color:var(--text-4); }

/* 대시보드 */
.top{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px clamp(14px,3vw,32px); background:var(--navy); color:#fff; }
.top strong{ font-size:20px; font-weight:800; }
.top__btns{ display:flex; flex-wrap:wrap; gap:10px; }
.tbtn{ min-height:44px; padding:0 18px; background:transparent; color:#fff; border:2px solid var(--cyan-lt); border-radius:999px; font-size:16px; font-weight:700; cursor:pointer; }
.tbtn--amber{ background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:800; }
.tbtn--gray{ border-color:var(--text-4); }
.body{ display:grid; gap:20px; max-width:1400px; margin:0 auto; padding:24px clamp(14px,3vw,32px) 60px; }
.me{ font-size:14px; color:var(--text-3); }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:14px; }
.stat{ padding:18px 20px; background:#fff; border:1px solid var(--line); border-radius:14px; }
.stat__k{ font-weight:600; color:var(--text-3); }
.stat__v{ font-size:36px; font-weight:800; line-height:1.3; }
.stat__v--new{ color:#B45309; }
.ratio{ display:grid; grid-template-columns:1fr auto; gap:2px 8px; font-size:14px; line-height:1.5; }
.ratio__bar{ grid-column:1/3; height:6px; margin-bottom:4px; background:var(--line); border-radius:3px; }
.ratio__bar i{ display:block; height:6px; background:var(--teal); border-radius:3px; }
.filter{ display:flex; flex-wrap:wrap; gap:10px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:14px; }
.filter .input{ flex:1 1 160px; width:auto; min-height:46px; }
.empty{ padding:48px 20px; background:#fff; border:2px dashed #94A3B8; border-radius:14px; text-align:center; color:var(--text-3); font-size:17px; }
.tbl-wrap{ display:none; overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:14px; }
.tbl{ width:100%; min-width:1180px; border-collapse:collapse; font-size:15px; }
.tbl th{ padding:12px; background:var(--soft-2); text-align:left; }
.tbl td{ padding:12px; border-top:1px solid var(--line); vertical-align:top; }
.tbl .nw{ white-space:nowrap; } .tbl .brk{ word-break:break-all; } .tbl .msg{ max-width:220px; white-space:pre-wrap; } .tbl .nm{ font-weight:700; }
.tbl .input{ width:auto; min-height:42px; padding:0 8px; font-size:15px; border-radius:8px; }
.tbl .memo{ width:180px; border-color:#CBD5E1; }
.cards{ display:grid; gap:12px; }
.rc{ display:grid; gap:8px; padding:16px; background:#fff; border:1px solid var(--line); border-radius:14px; }
.rc__top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.rc__top b{ font-size:18px; } .rc__top span{ font-size:14px; color:var(--text-3); }
.rc__int{ color:var(--teal); font-weight:700; }
.rc__msg{ white-space:pre-wrap; color:var(--text-2); word-break:break-all; }
.rc .input{ min-height:48px; padding:0 10px; border-radius:8px; }
.del{ min-height:44px; padding:0 14px; background:#fff; color:var(--danger); border:2px solid var(--danger); border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
@media (min-width:768px){ .tbl-wrap{ display:block; } .cards{ display:none; } }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login" hidden>
  <form id="loginForm" novalidate>
    <h1>관리자 로그인</h1>
    <label>이메일
      <input class="input" type="email" id="email" autocomplete="username" required>
    </label>
    <label>비밀번호
      <input class="input" type="password" id="pw" autocomplete="current-password" required>
    </label>
    <span class="err" id="loginErr" role="alert" hidden></span>
    <button type="submit" class="btn" id="loginBtn">로그인</button>
    <small>수강 신청 내역은 관리자 계정으로 로그인해야 볼 수 있습니다.</small>
  </form>
</div>

<!-- 대시보드 -->
<div id="dash" hidden>
  <div class="top">
    <strong>신청 관리 · AI 에이전트 마스터클래스</strong>
    <div class="top__btns">
      <button type="button" class="tbtn" id="btnRefresh">새로고침</button>
      <button type="button" class="tbtn" id="btnMask">연락처·이메일 보이기</button>
      <button type="button" class="tbtn tbtn--amber" id="btnCsv">CSV 다운로드</button>
      <button type="button" class="tbtn tbtn--gray" id="btnLogout">로그아웃</button>
    </div>
  </div>
  <div class="body">
    <p class="me" id="me"></p>
    <div class="stats" id="stats"></div>
    <div class="filter">
      <input class="input" type="search" id="fq" placeholder="이름·연락처 검색" style="flex-basis:200px">
      <select class="input" id="fi"></select>
      <select class="input" id="fs"><option value="">상태 전체</option><option value="신규">신규</option><option value="상담중">상담중</option><option value="등록완료">등록완료</option></select>
      <select class="input" id="fsort"><option value="desc">최신순</option><option value="asc">오래된순</option></select>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* 공개용 키(anon): 신청 저장만 가능하고, 조회·수정·삭제는 관리자 로그인 후에만 됩니다. */
  var SUPABASE_URL = 'https://pnginpetzutnfqryzmcl.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuZ2lucGV0enV0bmZxcnl6bWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNTkyNTMsImV4cCI6MjEwNzYzNTI1M30.xQ1l46jHUbOLYkxfIeD5P6Tn_6rzvHlVsSlEWpI_Op4';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var fmtTime = function (iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var fmtPhone = function (p) { return p.length === 11 ? p.slice(0, 3) + '-' + p.slice(3, 7) + '-' + p.slice(7) : p.length === 10 ? p.slice(0, 3) + '-' + p.slice(3, 6) + '-' + p.slice(6) : p; };
  var maskPhone = function (p) { var f = fmtPhone(p).split('-'); return f.length === 3 ? f[0] + '-****-' + f[2] : '****'; };
  var maskEmail = function (e) { if (!e) return '-'; var x = e.split('@'); return x[1] ? x[0].slice(0, 2) + '***@' + x[1] : '***'; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var rows = [], mask = true;

  /* ---------- 로그인 / 로그아웃 ---------- */
  function showLogin(msg) {
    $('#dash').hidden = true; $('#login').hidden = false;
    $('#loginErr').hidden = !msg; $('#loginErr').textContent = msg ? '⚠ ' + msg : '';
  }

  async function enter(session) {
    // 관리자 목록(admins)에 내 이메일이 있어야 들어올 수 있습니다.
    var r = await sb.from('admins').select('email').maybeSingle();
    if (r.error || !r.data) {
      await sb.auth.signOut();
      showLogin('관리자 권한이 없는 계정입니다.');
      return;
    }
    $('#login').hidden = true; $('#dash').hidden = false;
    $('#me').textContent = '로그인: ' + session.user.email;
    await load();
  }

  $('#loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '로그인 중...';
    var r = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
    btn.disabled = false; btn.textContent = '로그인';
    if (r.error || !r.data.session) { showLogin('이메일 또는 비밀번호가 맞지 않습니다.'); return; }
    $('#pw').value = '';
    await enter(r.data.session);
  });
  $('#btnLogout').addEventListener('click', async function () { await sb.auth.signOut(); rows = []; showLogin(''); });

  /* ---------- 데이터 ---------- */
  async function load() {
    var r = await sb.from('registrations').select('*').order('created_at', { ascending: false }).limit(2000);
    if (r.error) { $('#list').innerHTML = '<div class="empty">불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>'; console.error(r.error); return; }
    rows = r.data || [];
    refreshInterestOptions();
    render();
  }

  function refreshInterestOptions() {
    var sel = $('#fi'), cur = sel.value, seen = {}, opts = '<option value="">관심분야 전체</option>';
    rows.forEach(function (a) { if (a.interest && !seen[a.interest]) { seen[a.interest] = 1; opts += '<option value="' + esc(a.interest) + '">' + esc(a.interest) + '</option>'; } });
    opts += '<option value="__none">(미선택)</option>';
    sel.innerHTML = opts; sel.value = cur;
  }

  function render() {
    var todayStr = fmtTime(new Date().toISOString()).slice(0, 10);
    var q = $('#fq').value.trim().replace(/-/g, '').toLowerCase(), fi = $('#fi').value, fs = $('#fs').value, sort = $('#fsort').value;
    var list = rows.filter(function (a) {
      return (!q || a.name.toLowerCase().indexOf(q) >= 0 || a.phone.indexOf(q) >= 0) &&
        (!fi || (fi === '__none' ? !a.interest : a.interest === fi)) && (!fs || a.status === fs);
    });
    list.sort(function (a, b) { var d = new Date(a.created_at) - new Date(b.created_at); return sort === 'asc' ? d : -d; });

    var tot = rows.length, counts = {};
    rows.forEach(function (a) { var k = a.interest || '(미선택)'; counts[k] = (counts[k] || 0) + 1; });
    var ratioHtml = tot === 0 ? '<div style="color:#64748B">데이터 없음</div>' : '<div class="ratio">' + Object.keys(counts).map(function (k) {
      return '<span>' + esc(k) + '</span><b>' + Math.round(counts[k] / tot * 100) + '% (' + counts[k] + ')</b><div class="ratio__bar"><i style="width:' + (counts[k] / tot * 100) + '%"></i></div>';
    }).join('') + '</div>';
    $('#stats').innerHTML =
      '<div class="stat"><div class="stat__k">전체 신청 수</div><div class="stat__v">' + tot + '</div></div>' +
      '<div class="stat"><div class="stat__k">오늘 신청 수</div><div class="stat__v">' + rows.filter(function (a) { return fmtTime(a.created_at).slice(0, 10) === todayStr; }).length + '</div></div>' +
      '<div class="stat"><div class="stat__k">미처리(신규) 건수</div><div class="stat__v stat__v--new">' + rows.filter(function (a) { return a.status === '신규'; }).length + '</div></div>' +
      '<div class="stat"><div class="stat__k" style="margin-bottom:6px">관심분야별 비율</div>' + ratioHtml + '</div>';
    $('#btnMask').textContent = mask ? '연락처·이메일 보이기' : '연락처·이메일 가리기';

    if (!list.length) {
      $('#list').innerHTML = '<div class="empty">' + (tot === 0 ? '아직 접수된 신청이 없습니다. 랜딩페이지에서 신청이 들어오면 여기에 바로 표시됩니다.' : '조건에 맞는 신청이 없습니다. 검색어나 필터를 바꿔 보세요.') + '</div>';
      return;
    }
    var statusSel = function (a) {
      return '<select class="input" data-act="status" data-id="' + esc(a.id) + '" style="font-weight:700">' +
        ['신규', '상담중', '등록완료'].map(function (s) { return '<option value="' + s + '"' + (a.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>';
    };
    var phone = function (a) { return esc(mask ? maskPhone(a.phone) : fmtPhone(a.phone)); };
    var email = function (a) { return esc(mask ? maskEmail(a.email) : (a.email || '-')); };
    var tr = list.map(function (a) {
      return '<tr><td class="nw">' + fmtTime(a.created_at) + '</td><td class="nm">' + esc(a.name) + '</td><td class="nw">' + phone(a) + '</td>' +
        '<td class="brk">' + email(a) + '</td><td>' + esc(a.interest || '-') + '</td><td class="msg">' + esc(a.message || '-') + '</td>' +
        '<td>' + statusSel(a) + '</td><td><input class="input memo" type="text" data-act="memo" data-id="' + esc(a.id) + '" value="' + esc(a.memo || '') + '" placeholder="메모 입력 후 Enter"></td>' +
        '<td><button type="button" class="del" data-act="del" data-id="' + esc(a.id) + '">삭제</button></td></tr>';
    }).join('');
    var cards = list.map(function (a) {
      return '<div class="rc"><div class="rc__top"><b>' + esc(a.name) + '</b><span>' + fmtTime(a.created_at) + '</span></div>' +
        '<div>' + phone(a) + '</div><div style="word-break:break-all">' + email(a) + '</div>' +
        '<div class="rc__int">' + esc(a.interest || '-') + '</div><div class="rc__msg">' + esc(a.message || '-') + '</div>' +
        statusSel(a) + '<input class="input" type="text" data-act="memo" data-id="' + esc(a.id) + '" value="' + esc(a.memo || '') + '" placeholder="관리 메모">' +
        '<button type="button" class="del" data-act="del" data-id="' + esc(a.id) + '">삭제</button></div>';
    }).join('');
    $('#list').innerHTML =
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>접수일시</th><th>이름</th><th>연락처</th><th>이메일</th><th>관심분야</th><th>상담 내용</th><th>처리상태</th><th>관리 메모</th><th>관리</th></tr></thead><tbody>' + tr + '</tbody></table></div>' +
      '<div class="cards">' + cards + '</div>';
  }

  /* ---------- 수정 / 삭제 ---------- */
  function find(id) { return rows.filter(function (a) { return a.id === id; })[0]; }

  async function patch(id, change) {
    var r = await sb.from('registrations').update(change).eq('id', id);
    if (r.error) { window.alert('저장하지 못했습니다. 다시 시도해 주세요.'); console.error(r.error); return false; }
    Object.assign(find(id), change);
    return true;
  }

  var list = $('#list');
  list.addEventListener('change', async function (e) {
    var t = e.target, id = t.dataset.id;
    if (t.dataset.act === 'status') { if (await patch(id, { status: t.value })) render(); else render(); }
    else if (t.dataset.act === 'memo') { await patch(id, { memo: t.value.trim() || null }); }
  });
  list.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset.act === 'memo') e.target.blur(); });
  list.addEventListener('click', async function (e) {
    var t = e.target.closest('[data-act="del"]');
    if (!t) return;
    var a = find(t.dataset.id);
    if (!a || !window.confirm(a.name + ' 님의 신청을 삭제할까요? 되돌릴 수 없습니다.')) return;
    var r = await sb.from('registrations').delete().eq('id', a.id);
    if (r.error) { window.alert('삭제하지 못했습니다. 다시 시도해 주세요.'); console.error(r.error); return; }
    rows = rows.filter(function (x) { return x.id !== a.id; });
    refreshInterestOptions(); render();
  });

  ['fq', 'fi', 'fs', 'fsort'].forEach(function (id) { $('#' + id).addEventListener(id === 'fq' ? 'input' : 'change', render); });
  $('#btnMask').addEventListener('click', function () { mask = !mask; render(); });
  $('#btnRefresh').addEventListener('click', load);

  $('#btnCsv').addEventListener('click', function () {
    // 엑셀에서 수식으로 실행되지 않도록 = + - @ 로 시작하는 값 앞에 ' 를 붙입니다.
    var cell = function (x) { var s = String(x == null ? '' : x); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    var head = ['접수일시', '이름', '연락처', '이메일', '관심분야', '상담 내용', '처리상태', '관리 메모'];
    var lines = [head].concat(rows.map(function (a) { return [fmtTime(a.created_at), a.name, fmtPhone(a.phone), a.email, a.interest, a.message, a.status, a.memo]; }))
      .map(function (r) { return r.map(cell).join(','); });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'registrations_' + fmtTime(new Date().toISOString()).slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
  });

  /* ---------- 시작 ---------- */
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enter(r.data.session); else showLogin('');
  });
})();
</script>
</body>
</html>
